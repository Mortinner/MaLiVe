name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq icoutils msitools shellcheck desktop-file-utils
          pip install pytest pylnk3
      - name: Tests
        run: python -m pytest -q
      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh
