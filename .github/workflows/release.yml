name: Publicar versión

# Se publica sola cuando cambia la versión en release.json en main:
# subir la versión en malive/__init__.py, release.json y CHANGELOG.md,
# commit y push. Este flujo crea la etiqueta vX.Y.Z y la release.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la versión y comprobar que no está publicada
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(python -c "import json; print(json.load(open('release.json'))['version'])")"
          echo "V=$V" >> "$GITHUB_ENV"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La versión $V ya está publicada; nada que hacer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "__version__ = \"$V\"" malive/__init__.py || { echo "malive/__init__.py no es $V"; exit 1; }
          grep -q "^## $V\$" CHANGELOG.md || { echo "CHANGELOG.md no tiene la sección $V"; exit 1; }

      - name: Tests
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq icoutils msitools shellcheck desktop-file-utils
          pip install pytest pylnk3
          python -m pytest -q
          shellcheck -S warning install.sh uninstall.sh

      - name: Empaquetar
        if: steps.ver.outputs.skip != 'true'
        run: |
          git archive --format=zip --prefix="malive-$V/" -o "malive-$V.zip" HEAD
          sha256sum "malive-$V.zip" | cut -d' ' -f1 > "malive-$V.zip.sha256"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publicar
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" "malive-$V.zip" "malive-$V.zip.sha256" \
            --target "$GITHUB_SHA" --title "MaLiVe $V" --notes-file notes.md
